# Render Blueprint: the portfolio as a static site (no server, so it never sleeps).
# Render builds it from GitHub on every push to main and serves the dist/ folder from its CDN.
services:
  - type: web
    name: mert-kaya-portfolio
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # React Router pages (/projects/…): every path without a real file gets index.html.
    # Render serves existing files (assets, CV, images) first and only rewrites the rest.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite puts a content hash in every asset file name, so they can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
