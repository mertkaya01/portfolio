# Render Blueprint: the portfolio as a static site (no server, so it never sleeps).
# Render builds it from GitHub on every push to main and serves the dist/ folder from its CDN.
services:
  - type: web
    name: mert-kaya-portfolio
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    # The app's pages: "/" is index.html itself; each project page is rewritten to it here, one
    # by one (npm run content:check makes sure every project is listed). Any other address
    # matches no rule, so Render answers with dist/404.html and a real 404 status — the app's own
    # "page not found" for visitors, a proper 404 for search engines. Real files (assets, the CV,
    # images) are always served first.
    routes:
      - type: rewrite
        source: /projects/hotel-commerce-service
        destination: /index.html
      - type: rewrite
        source: /projects/hotel-ai-concierge
        destination: /index.html
      - type: rewrite
        source: /projects/exam-verification-engine
        destination: /index.html
      - type: rewrite
        source: /projects/marketplace
        destination: /index.html
      - type: rewrite
        source: /projects/uptime-monitor
        destination: /index.html
      - type: rewrite
        source: /projects/hotel-whatsapp-bot
        destination: /index.html
      - type: rewrite
        source: /projects/zenith-whatsapp-bot
        destination: /index.html
      - type: rewrite
        source: /projects/weather-currency-bot
        destination: /index.html
      - type: rewrite
        source: /projects/capstone-secure-network
        destination: /index.html
      - type: rewrite
        source: /projects/linguatype
        destination: /index.html
      - type: rewrite
        source: /projects/data-analysis-engine
        destination: /index.html
    headers:
      # Vite puts a content hash in every asset file name, so they can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
